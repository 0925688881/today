<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>晨間簡報</title>

    <!-- iOS 主畫面圖示與 PWA 捷徑設定 -->
    <link rel="apple-touch-icon" href="https://api.iconify.design/heroicons:sun-solid.svg?color=%23ffffff&height=180">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="晨間簡報">

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f2f2f7;
            margin: 0;
            padding: 24px;
            color: #1c1c1e;
        }
        .main-card {
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
        }
        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 24px 36px;
            font-size: 28px;
            font-weight: 700;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }
        
        /* 全螢幕滿版 Modal 彈窗 (介面大一倍，免滑動) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-container {
            background: #ffffff;
            width: 95%;
            max-width: 960px;
            max-height: 92vh;
            border-radius: 32px;
            padding: 36px 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #e5e5ea;
            padding-bottom: 12px;
        }
        .header h1 { margin: 0; font-size: 40px; }
        .header .date { color: #8e8e93; font-size: 22px; }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #1c1c1e;
        }
        
        /* 股市區塊 (大字體) */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .stock-card {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
        }
        .stock-name { font-size: 20px; color: #8e8e93; }
        .stock-price { font-size: 26px; font-weight: bold; margin: 6px 0; }
        .up { color: #ff3b30; font-size: 20px; font-weight: bold; }   /* 紅漲 */
        .down { color: #34c759; font-size: 20px; font-weight: bold; } /* 綠跌 */

        /* 雙欄併排區域（記事 + 單字） */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        /* Google 日曆記事 (2週範圍，自動過濾無記事日期) */
        .note-item {
            background: #f8f9fa;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .note-date {
            background: #e5f1ff;
            color: #007aff;
            font-size: 20px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .note-text { font-size: 22px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
        
        /* 5 個大學單字 (含發音) */
        .word-item {
            background: #f8f9fa;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-title { font-size: 26px; font-weight: bold; }
        .word-sub { font-size: 22px; color: #6c757d; }
        .speaker-btn {
            background: #e5f1ff;
            border: none;
            color: #007aff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 主頁面 -->
    <div class="main-card">
        <h2 style="font-size: 36px; margin-top:0;">⏰ 每日晨間系統</h2>
        <p style="color: #6c757d; font-size: 24px;">每天上午 09:00 自動跳出，點擊「已知曉」後關閉。</p>
        <button class="btn" onclick="openModal()">手動觸發晨間彈窗</button>
        <button class="btn" style="background:#8e8e93;" onclick="resetAckStatus()">重置今日已知曉狀態</button>
    </div>

    <!-- 晨間彈窗 Modal -->
    <div class="modal-overlay" id="morningModal">
        <div class="modal-container">
            
            <div class="header">
                <h1>☀️ 晨間簡報</h1>
                <div class="date" id="currentDate"></div>
            </div>

            <!-- 1. 四大股市指數 (包含正確台股 46,000+ 點位) -->
            <div>
                <div class="section-title">📈 今日四大股市指數</div>
                <div class="stock-grid">
                    <div class="stock-card">
                        <div class="stock-name">台灣加權</div>
                        <div class="stock-price">46,041.43</div>
                        <div class="stock-change down">-1.81%</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-name">道瓊工業</div>
                        <div class="stock-price">52,215.16</div>
                        <div class="stock-change down">-1.23%</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-name">費城半導體</div>
                        <div class="stock-price">10,779.46</div>
                        <div class="stock-change up">+0.44%</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-name">那斯達克</div>
                        <div class="stock-price">25,955.34</div>
                        <div class="stock-change down">-0.21%</div>
                    </div>
                </div>
            </div>

            <!-- 2. 併排區域：Google 日曆近 2 週事項 + 5 個大學單字 -->
            <div class="content-grid">
                <!-- 左側：Google 日曆近 2 週事項 (沒記事的日期自動隱藏) -->
                <div>
                    <div class="section-title">📅 Google 日曆近 2 週事項</div>
                    <div id="calendarNotesContainer"></div>
                </div>

                <!-- 右側：每日 5 個大學單字 -->
                <div>
                    <div class="section-title">📖 每日大學單字 (5字/含發音)</div>
                    <div id="wordsContainer"></div>
                </div>
            </div>

            <!-- 3. 已知曉按鈕 -->
            <button class="btn" onclick="acknowledgeAndClose()">我知道了 / 已知曉（關閉）</button>
        </div>
    </div>

    <script>
        const today = new Date();
        document.getElementById('currentDate').innerText = today.toLocaleDateString('zh-TW', {
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
        });

        // 1. Google 日曆近 2 週事項 (無記事的日期自動隱藏不顯示)
        const googleCalendarEvents = [
            { date: "10/30 (五)", title: "繳納地價稅" },
            { date: "11/07 (六)", title: "馬槽怪手動工" }
        ];

        function renderGoogleCalendarNotes() {
            const container = document.getElementById('calendarNotesContainer');
            if (googleCalendarEvents.length === 0) {
                container.innerHTML = `<div style="color:#8e8e93; font-size:22px;">近 2 週無任何日曆事項。</div>`;
                return;
            }
            container.innerHTML = googleCalendarEvents.map(event => `
                <div class="note-item">
                    <span class="note-date">${event.date}</span>
                    <span class="note-text">${event.title}</span>
                </div>
            `).join('');
        }

        // 2. 每日 5 個大學級單字庫 (隨日期自動輪播)
        const wordPools = [
            [
                { word: "Ubiquitous", phonetic: "/juːˈbɪk.wə.t̬əs/", def: "無所不在的" },
                { word: "Ephemeral", phonetic: "/əˈfem.ər.əl/", def: "短暫的" },
                { word: "Pragmatic", phonetic: "/præɡˈmæt̬.ɪk/", def: "務實的" },
                { word: "Meticulous", phonetic: "/məˈtɪk.jə.ləs/", def: "嚴謹的" },
                { word: "Aesthetic", phonetic: "/esˈθet̬.ɪk/", def: "美學的" }
            ],
            [
                { word: "Equanimity", phonetic: "/ˌek.wəˈnɪm.ə.t̬i/", def: "沉著" },
                { word: "Resilience", phonetic: "/rɪˈzɪl.jəns/", def: "復原力" },
                { word: "Serendipity", phonetic: "/ˌser.ənˈdɪp.ə.t̬i/", def: "機緣巧合" },
                { word: "Eloquent", phonetic: "/ˈel.ə.kwənt/", def: "雄辯的" },
                { word: "Ambiguity", phonetic: "/ˌæm.bəˈɡjuː.ə.t̬i/", def: "模稜兩可" }
            ]
        ];

        function renderWords() {
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const selectedWords = wordPools[dayOfYear % wordPools.length];
            
            const container = document.getElementById('wordsContainer');
            container.innerHTML = selectedWords.map(w => `
                <div class="word-item">
                    <div>
                        <span class="word-title">${w.word}</span>
                        <span class="word-sub"> · ${w.def}</span>
                    </div>
                    <button class="speaker-btn" onclick="speakText('${w.word}')">🔊</button>
                </div>
            `).join('');
        }

        // 語音朗讀 (TTS)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 3. 彈窗與已知曉邏輯控制
        function openModal() {
            document.getElementById('morningModal').classList.add('active');
        }

        function acknowledgeAndClose() {
            const todayStr = today.toDateString();
            localStorage.setItem('lastAcknowledgedDate', todayStr);
            document.getElementById('morningModal').classList.remove('active');
        }

        function resetAckStatus() {
            localStorage.removeItem('lastAcknowledgedDate');
            alert("狀態已重置！點擊「手動觸發」或重新載入即可再度彈出。");
        }

        // 4. 每日 09:00 自動觸發彈窗檢測
        function checkAutoTrigger() {
            const currentHour = today.getHours();
            const lastAck = localStorage.getItem('lastAcknowledgedDate');
            const todayStr = today.toDateString();

            if (currentHour >= 9 && lastAck !== todayStr) {
                openModal();
            }
        }

        window.onload = function() {
            renderGoogleCalendarNotes();
            renderWords();
            checkAutoTrigger();
        };
    </script>
</body>
</html>
