<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 滿版大字體晨間簡報系統</title>
    <style>
        /* 基礎重置與高對比字體設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 鎖定頁面尺寸，防止任何全域捲動 */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f2f2f7;
            color: #000000;
        }

        /* 背景主卡片 (手動測試介面) */
        .main-card {
            width: 90vw;
            max-width: 800px;
            margin: 50px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .main-card h2 { font-size: 38px; margin-bottom: 16px; font-weight: 800; }
        .main-card p { font-size: 24px; color: #48484a; margin-bottom: 30px; }
        .test-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 22px 30px;
            font-size: 28px;
            font-weight: 700;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .reset-btn { background-color: #8e8e93; }

        /* 全螢幕 100vw x 100vh 高對比無滑動 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 極致大字體且高度分配精準的容器 (絕對不溢出、不滑動) */
        .modal-container {
            background: #ffffff;
            width: 96vw;
            height: 94vh;
            max-width: 1280px;
            max-height: 950px;
            border-radius: 36px;
            padding: 28px 36px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            overflow: hidden; /* 嚴格禁止內部滾動軸 */
        }

        /* 標頭區域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1c1c1e;
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #000000;
        }
        .header .date {
            font-size: 24px;
            font-weight: 700;
            color: #3a3a3c;
            background: #e5e5ea;
            padding: 6px 16px;
            border-radius: 12px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 1. 四大股市指數區塊 (4 欄式橫向高對比卡片) */
        .stock-section { flex-shrink: 0; }
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .stock-card {
            background: #f2f2f7;
            padding: 12px 10px;
            border-radius: 18px;
            text-align: center;
            border: 2px solid #e5e5ea;
        }
        .stock-name { font-size: 20px; color: #48484a; font-weight: 800; }
        .stock-price { font-size: 28px; font-weight: 900; margin: 2px 0; color: #000000; }
        .up { color: #d70015; font-size: 22px; font-weight: 900; }   /* 高對比紅漲 */
        .down { color: #28cd41; font-size: 22px; font-weight: 900; } /* 高對比綠跌 */

        /* 2. 雙欄主要內容區 (高動態伸縮彈性高度) */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0; /* 關鍵：防止 flex 內容撐開造成滑動 */
        }

        /* 兩欄內部 flex 垂直佈局 */
        .column-box {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            justify-content: space-evenly; /* 自動均分行高避免出現捲軸 */
            min-height: 0;
        }

        /* Google 日曆事項卡片 */
        .note-item {
            background: #f2f2f7;
            padding: 10px 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 6px solid #007aff;
        }
        .note-date {
            background: #007aff;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .note-text {
            font-size: 26px;
            font-weight: 800;
            color: #000000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 大學英文單字卡片 */
        .word-item {
            background: #f2f2f7;
            padding: 8px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1.5px solid #e5e5ea;
        }
        .word-info {
            display: flex;
            align-items: baseline;
            gap: 12px;
            overflow: hidden;
        }
        .word-title { font-size: 28px; font-weight: 900; color: #000000; }
        .word-sub { font-size: 22px; color: #3a3a3c; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .speaker-btn {
            background: #007aff;
            border: none;
            color: #ffffff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
        }
        .speaker-btn:active { transform: scale(0.92); }

        /* 3. 超大關閉按鈕 (高度 80px，字體 34px) */
        .close-btn {
            background-color: #34c759;
            color: #ffffff;
            border: none;
            height: 72px;
            font-size: 32px;
            font-weight: 900;
            border-radius: 22px;
            width: 100%;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(52,199,89,0.35);
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }
        .close-btn:active {
            background-color: #28cd41;
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <!-- 背景測試操作卡片 -->
    <div class="main-card">
        <h2>⏰ iOS 晨間系統控制台</h2>
        <p>系統預設每天上午 9:00 自動觸發滿版彈窗。點擊「已知曉」後今日不再重複彈出。</p>
        <button class="test-btn" onclick="openModal()">手動觸發晨間簡報彈窗</button>
        <button class="test-btn reset-btn" onclick="resetAckStatus()">重置今日已知曉狀態</button>
    </div>

    <!-- 滿版 100vw x 100vh 全螢幕彈窗 (免滑動高對比版) -->
    <div class="modal-overlay" id="morningModal">
        <div class="modal-container">
            
            <!-- 標頭列 -->
            <div class="header">
                <h1>☀️ 晨間即時簡報</h1>
                <div class="date" id="currentDate">--月--日</div>
            </div>

            <!-- 1. 四大股市指數區塊 -->
            <div class="stock-section">
                <div class="section-title">📈 今日四大股市指數</div>
                <div class="stock-grid">
                    <div class="stock-card">
                        <div class="stock-name">台灣加權</div>
                        <div class="stock-price">46,041.43</div>
                        <div class="stock-change down">-1.81%</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-name">道瓊工業</div>
                        <div class="stock-price">52,215.16</div>
                        <div class="stock-change down">-1.23%</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-name">費城半導體</div>
                        <div class="stock-price">10,779.46</div>
                        <div class="stock-change up">+0.44%</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-name">那斯達克</div>
                        <div class="stock-price">25,955.34</div>
                        <div class="stock-change down">-0.21%</div>
                    </div>
                </div>
            </div>

            <!-- 2. 併排內容區：左側 2 週日曆事項，右側每日 5 大學單字 -->
            <div class="content-grid">
                <!-- 左欄：Google 日曆近 2 週事項 (自動隱藏無記事日期) -->
                <div class="column-box">
                    <div class="section-title">📅 近 2 週 Google 日曆事項</div>
                    <div class="list-container" id="calendarNotesContainer">
                        <!-- JS 自動渲染有記事的日期 -->
                    </div>
                </div>

                <!-- 右欄：每日 5 個大學級英文單字 -->
                <div class="column-box">
                    <div class="section-title">📖 每日大學單字 (5字/含發音)</div>
                    <div class="list-container" id="wordsContainer">
                        <!-- JS 自動渲染 -->
                    </div>
                </div>
            </div>

            <!-- 3. 超大醒目關閉按鈕 -->
            <button class="close-btn" onclick="acknowledgeAndClose()">我知道了 / 已知曉（關閉頁面）</button>

        </div>
    </div>

    <script>
        const today = new Date();
        
        // 渲染日期
        document.getElementById('currentDate').innerText = today.toLocaleDateString('zh-TW', {
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
        });

        // 1. Google 日曆近 2 週 (14天) 事項 (無記事日期自動隱藏)
        const googleCalendarEvents = [
            { date: "10/30 (五)", title: "繳納地價稅" },
            { date: "11/07 (六)", title: "馬槽怪手動工" }
        ];

        function renderGoogleCalendarNotes() {
            const container = document.getElementById('calendarNotesContainer');
            if (googleCalendarEvents.length === 0) {
                container.innerHTML = `<div style="font-size:26px; color:#8e8e93; text-align:center;">近 2 週無任何安排事項。</div>`;
                return;
            }
            container.innerHTML = googleCalendarEvents.map(event => `
                <div class="note-item">
                    <span class="note-date">${event.date}</span>
                    <span class="note-text">${event.title}</span>
                </div>
            `).join('');
        }

        // 2. 每日 5 個大學級單字 (每日根據日期輪播不同單字)
        const wordPools = [
            [
                { word: "Ubiquitous", phonetic: "/juːˈbɪk.wə.t̬əs/", def: "無所不在的" },
                { word: "Ephemeral", phonetic: "/əˈfem.ər.əl/", def: "短暫的；轉瞬即逝的" },
                { word: "Pragmatic", phonetic: "/præɡˈmæt̬.ɪk/", def: "務實的；重實效的" },
                { word: "Meticulous", phonetic: "/məˈtɪk.jə.ləs/", def: "嚴謹的；縝密的" },
                { word: "Aesthetic", phonetic: "/esˈθet̬.ɪk/", def: "美學的；審美的" }
            ],
            [
                { word: "Equanimity", phonetic: "/ˌek.wəˈnɪm.ə.t̬i/", def: "鎮定；沉著" },
                { word: "Resilience", phonetic: "/rɪˈzɪl.jəns/", def: "彈性；復原力" },
                { word: "Serendipity", phonetic: "/ˌser.ənˈdɪp.ə.t̬i/", def: "機緣巧合" },
                { word: "Eloquent", phonetic: "/ˈel.ə.kwənt/", def: "雄辯的；有說服力的" },
                { word: "Ambiguity", phonetic: "/ˌæm.bəˈɡjuː.ə.t̬i/", def: "模稜兩可；含糊" }
            ]
        ];

        function renderWords() {
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const selectedWords = wordPools[dayOfYear % wordPools.length];
            
            const container = document.getElementById('wordsContainer');
            container.innerHTML = selectedWords.map(w => `
                <div class="word-item">
                    <div class="word-info">
                        <span class="word-title">${w.word}</span>
                        <span class="word-sub"> · ${w.def}</span>
                    </div>
                    <button class="speaker-btn" onclick="speakText('${w.word}')" title="點擊發音">🔊</button>
                </div>
            `).join('');
        }

        // 美式英文語音發音 (Web Speech Synthesis API)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 稍慢發音更清晰
                window.speechSynthesis.speak(utterance);
            }
        }

        // 3. 彈窗與已知曉狀態控制
        function openModal() {
            document.getElementById('morningModal').classList.add('active');
        }

        function acknowledgeAndClose() {
            const todayStr = today.toDateString();
            localStorage.setItem('lastAcknowledgedDate', todayStr);
            document.getElementById('morningModal').classList.remove('active');
        }

        function resetAckStatus() {
            localStorage.removeItem('lastAcknowledgedDate');
            alert("已重置已知曉狀態！點擊「手動觸發」即可重新測試彈窗。");
        }

        // 4. 自動檢測：每天上午 9 點過後開頁面且當天未點擊已知曉，自動彈出
        function checkAutoTrigger() {
            const currentHour = today.getHours();
            const lastAck = localStorage.getItem('lastAcknowledgedDate');
            const todayStr = today.toDateString();

            if (currentHour >= 9 && lastAck !== todayStr) {
                openModal();
            }
        }

        // 頁面載入完成初始化
        window.onload = function() {
            renderGoogleCalendarNotes();
            renderWords();
            checkAutoTrigger();
        };
    </script>
</body>
</html>
